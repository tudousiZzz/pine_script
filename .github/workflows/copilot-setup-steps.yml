name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Pine Script development tools
              run: |
                  # Install Node.js-based Pine Script tools
                  npm install -g pine-script-lint || true

                  # Install Python-based analysis tools
                  pip install --upgrade pip
                  pip install requests beautifulsoup4 lxml

            - name: Verify tool installations
              run: |
                  echo "Node.js version: $(node --version)"
                  echo "npm version: $(npm --version)"
                  echo "Python version: $(python --version)"
                  echo "pip version: $(pip --version)"
                  echo "Setup complete!"

            - name: Validate Pine Script files
              run: python3 scripts/validate_pine.py .
